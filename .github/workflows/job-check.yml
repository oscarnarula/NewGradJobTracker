name: Job Tracker

on:
  schedule:
    # Runs at 12:00 UTC daily = 8:00 AM Eastern (7:00 AM during EST)
    - cron: "0 12 * * *"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab to test
    inputs:
      full_report:
        description: "Full report: show every current match, ignoring history (doesn't update seen_jobs.json)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # needed so the workflow can commit the updated seen_jobs.json

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job tracker
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FULL_REPORT: ${{ github.event.inputs.full_report || 'false' }}
        run: python job_tracker.py

      - name: Commit updated seen_jobs.json
        if: ${{ github.event.inputs.full_report != 'true' }}
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
